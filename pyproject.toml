[project]
name = "rdp-agent"
version = "0.1.0"
description = "A scripted agent that operates a remote Windows desktop over RDP (no AI yet)"
readme = "README.md"
authors = [{ name = "Randy Hesse" }]
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    "pythonwrapfreerdp",
]

[project.scripts]
rdp-agent = "rdp_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
pythonwrapfreerdp = { path = "../PythonWrapFreeRDP", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
per-file-ignores = { "src/rdp_agent/recorder.py" = ["E501"] }  # inline CSS
select = ["E", "F", "W", "I", "B", "UP"]
